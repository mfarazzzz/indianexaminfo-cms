# Nginx config for cms.indianexaminfo.com
# Place at: /etc/nginx/sites-available/cms.indianexaminfo.com
# Enable: ln -s /etc/nginx/sites-available/cms.indianexaminfo.com /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cms.indianexaminfo.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.indianexaminfo.com;

    # SSL certificates (certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/cms.indianexaminfo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.indianexaminfo.com/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    root /var/www/indianexaminfo-cms/dist;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────

    # HSTS — force HTTPS for 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — restrict sensitive browser APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Content Security Policy
    # NOTE: 'unsafe-inline' in script-src is required by some Vite-injected
    # runtime code. Once migrated to a nonce-based CSP, remove it.
    # 'unsafe-eval' is required by @google/generative-ai (Protobuf).
    add_header Content-Security-Policy "
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      connect-src 'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://generativelanguage.googleapis.com
        https://www.indianexaminfo.com;
      img-src 'self' data: blob: https:;
      font-src 'self' data:;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " always;

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html — browser must always revalidate to get latest hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Immutable hashed assets — cache 1 year ────────────────────────────
    location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|jpeg|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Block direct access to sensitive files ────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type "text/plain; charset=utf-8";
        access_log off;
    }

    # ── Health check endpoint ─────────────────────────────────────────────
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type "text/plain; charset=utf-8";
        access_log off;
    }

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/wasm image/svg+xml;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/cms.indianexaminfo.com.access.log;
    error_log  /var/log/nginx/cms.indianexaminfo.com.error.log warn;
}
