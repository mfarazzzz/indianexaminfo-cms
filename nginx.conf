# Nginx config for SPA — serves index.html for all routes
# Place this in your server block or include it from your main config.

server {
    listen 80;
    server_name cms.indianexaminfo.com;
    root /var/www/indianexaminfo-cms/dist;
    index index.html;

    # SPA fallback: all routes serve index.html, client-side router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
